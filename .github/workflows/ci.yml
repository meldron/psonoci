name: Build
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      builder_image: meldron/psonoci_builder
    strategy:
      matrix:
        build: [ linux, linux-armv7, linux-aarch64, macos, win-gnu, win-msvc ]
        include:
          - build: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            target_type: unix
            use_cross: true
          - build: linux-armv7
            os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            target_type: unix
            use_cross: true
          - build: linux-armv7-musl
            os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            target_type: unix
            use_cross: true
          - build: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            target_type: unix
            use_cross: true
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            target_type: unix
            use_cross: false
          - build: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            target_type: unix
            use_cross: false
          - build: win-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
            target_type: windows
            use_cross: false
          - build: win-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            target_type: windows
            use_cross: false

    steps:
      - name: Get the version
        id: get_version
        shell: bash
        run: echo "SHA8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Load pinned SBOM tool versions
        id: sbom_tools
        shell: bash
        run: |
          . sbom/tool-versions.env
          echo "CARGO_AUDITABLE_VERSION=$CARGO_AUDITABLE_VERSION" >> "$GITHUB_ENV"
          echo "SYFT_VERSION=$SYFT_VERSION" >> "$GITHUB_ENV"
          echo "CROSS_VERSION=$CROSS_VERSION" >> "$GITHUB_ENV"
          echo "GRYPE_VERSION=$GRYPE_VERSION" >> "$GITHUB_ENV"
          echo "syft_version=$SYFT_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Keep this pinned to the repository toolchain in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cross@${{ env.CROSS_VERSION }}

      - name: Install cargo-auditable
        shell: bash
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"

      - name: Install Syft for the SBOM smoke test
        if: matrix.build == 'linux'
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v${{ steps.sbom_tools.outputs.syft_version }}

      - name: Pull docker image used by cross
        if: matrix.use_cross && matrix.target_type == 'unix'
        run: docker pull $builder_image:${{ matrix.target }}

      # the base image for armv7-unknown-linux-gnueabihf is broken (ca certs invalid), use a prebuilt image for now
      # - name: Build docker image used by cross
      #   if: matrix.os == 'ubuntu-24.04' && matrix.target_type == 'unix'
      #   run: docker build build_files --cache-from $builder_image:${{ matrix.target }} --file build_files/Dockerfile-${{ matrix.target }} --tag $builder_image:${{ matrix.target }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Check GitLab Windows bootstrap syntax
        if: matrix.target_type == 'windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/var/build_windows.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors | Out-String) }

      - name: SBOM adapter unit tests
        if: matrix.build == 'linux'
        run: python3 -m unittest discover -s tests -p 'test_sbom*.py' -v

      - name: Verify native OpenSSL version and HTTPS handshake
        if: matrix.build == 'linux'
        run: cargo test --locked --test native_tls

      - name: Link recorder unit tests
        if: matrix.build == 'linux'
        run: python3 scripts/test-sbom-linker.py

      - name: Install Grype for advisory matching controls
        if: matrix.build == 'linux'
        run: |
          bash scripts/install-grype.sh "$RUNNER_TEMP/psonoci-grype"
          echo "$RUNNER_TEMP/psonoci-grype" >> "$GITHUB_PATH"

      - name: Verify Cargo and native advisory matching
        if: matrix.build == 'linux'
        run: python3 scripts/test-sbom-scanner.py

      # - name: cargo test
      #   run: |
      #     if [ "${{ matrix.use_cross }}" = "true" ]; then
      #       cross test --release --target ${{ matrix.target }}
      #     else
      #       cargo test --release --target ${{ matrix.target }}
      #     fi

      - name: cargo build with embedded dependency evidence
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            image_args=()
            if [ "${{ matrix.target_type }}" = "unix" ]; then
              image_args=(--image "$builder_image:${{ matrix.target }}")
            fi
            python3 scripts/build-with-runtime-evidence.py \
              --target "${{ matrix.target }}" --cross "${image_args[@]}"
          else
            python3 scripts/build-with-runtime-evidence.py --target "${{ matrix.target }}"
          fi

      - name: Test release SBOM generation and CycloneDX schema
        if: matrix.build == 'linux'
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          tar -czf /tmp/psonoci-ci.tar.gz \
            -C "target/${{ matrix.target }}/release" psonoci
          scripts/generate-sbom.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/psonoci" \
            /tmp/psonoci-ci.tar.gz \
            /tmp/psonoci-ci.cdx.json \
            --commit "${{ github.sha }}"
          docker run --rm \
            -v /tmp:/work \
            cyclonedx/cyclonedx-cli:0.33.1@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7 \
            validate --input-file /work/psonoci-ci.cdx.json --input-version v1_6 --fail-on-errors

      - name: Verify final static binary HTTPS and certificate validation
        if: matrix.build == 'linux'
        run: python3 scripts/test-release-binary-tls.py target/${{ matrix.target }}/release/psonoci

      - name: upload unix artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.target_type == 'unix'
        with:
          name: psonoci-${{ env.SHA8 }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/psonoci

      - name: upload windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.target_type == 'windows'
        with:
          name: psonoci-${{ env.SHA8 }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/psonoci.exe
