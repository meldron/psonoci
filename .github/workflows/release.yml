name: Release
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
      - "release-test"

permissions:
  contents: write

jobs:
  test-sbom:
    name: SBOM regression and advisory matching controls
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Install pinned scanner
        run: |
          bash scripts/install-grype.sh "$RUNNER_TEMP/psonoci-grype"
          echo "$RUNNER_TEMP/psonoci-grype" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s tests -p 'test_sbom*.py' -v
      - run: python3 scripts/test-sbom-linker.py
      - name: Verify native OpenSSL version and HTTPS handshake
        run: cargo test --locked --test native_tls --timings
      - name: Upload native TLS build timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-tls-build-timings
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 scripts/test-sbom-scanner.py

  create-release:
    name: create-release
    needs: ["test-sbom"]
    runs-on: ubuntu-24.04
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            # The rolling test release may replace previously published assets.
            if [ "$RELEASE_TAG" != "release-test" ] && [ "$draft" != "true" ]; then
              echo "Refusing to replace assets of an already published release" >&2
              exit 1
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Each binary archive in Assets has a matching target-specific CycloneDX 1.6 SBOM (.cdx.json) and detached GPG signatures (.asc).

          See [SBOM verification instructions](https://github.com/${GH_REPO}/blob/${RELEASE_TAG}/SBOM.md).
          EOF
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Release $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  build-release:
    name: build-release
    needs: ["create-release"]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    env:
      builder_image: meldron/psonoci_builder
      RELEASE_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        build: [linux, linux-armv7, linux-aarch64, macos, win-gnu, win-msvc]
        include:
          - build: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            target_type: unix
            use_cross: true
          - build: linux-armv7
            os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            target_type: unix
            use_cross: true
          - build: linux-armv7-musl
            os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            target_type: unix
            use_cross: true
          - build: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            target_type: unix
            use_cross: true
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            target_type: unix
            use_cross: false
          - build: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            target_type: unix
            use_cross: false
          - build: win-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
            target_type: windows
            use_cross: false
          - build: win-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            target_type: windows
            use_cross: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Load pinned SBOM tool versions
        id: sbom_tools
        shell: bash
        run: |
          . sbom/tool-versions.env
          echo "CARGO_AUDITABLE_VERSION=$CARGO_AUDITABLE_VERSION" >> "$GITHUB_ENV"
          echo "SYFT_VERSION=$SYFT_VERSION" >> "$GITHUB_ENV"
          echo "CROSS_VERSION=$CROSS_VERSION" >> "$GITHUB_ENV"
          echo "GRYPE_VERSION=$GRYPE_VERSION" >> "$GITHUB_ENV"
          echo "syft_version=$SYFT_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: install rust
        # Keep this pinned to the repository toolchain in rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cross@${{ env.CROSS_VERSION }}

      - name: Install cargo-auditable
        shell: bash
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v${{ steps.sbom_tools.outputs.syft_version }}

      - name: Pull docker image used by cross
        if: matrix.use_cross && matrix.target_type == 'unix'
        run: docker pull $builder_image:${{ matrix.target }}

      # - name: Build docker image used by cross
      #   if: matrix.target != 'x86_64-pc-windows-gnu'
      #   run: docker build build_files --cache-from $builder_image:${{ matrix.target }} --file build_files/Dockerfile-${{ matrix.target }} --tag $builder_image:${{ matrix.target }}

      - name: build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            python3 scripts/build-with-runtime-evidence.py \
              --target "${{ matrix.target }}" --cross \
              --image "$builder_image:${{ matrix.target }}"
          else
            python3 scripts/build-with-runtime-evidence.py --target "${{ matrix.target }}"
          fi

      - name: Verify final static binary HTTPS and certificate validation
        if: matrix.build == 'linux'
        run: python3 scripts/test-release-binary-tls.py target/${{ matrix.target }}/release/psonoci --output target/${{ matrix.target }}/release/runtime-capture/binary-tls-validation.json

      - name: Check GitLab Windows bootstrap syntax
        if: matrix.target_type == 'windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/var/build_windows.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors | Out-String) }

      - name: Upload runtime evidence diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-evidence-${{ matrix.target }}
          path: |
            target/cargo-timings/*.html
            target/${{ matrix.target }}/release/runtime-capture/binary-tls-validation.json
            target/${{ matrix.target }}/release/psonoci.runtime.json
            target/${{ matrix.target }}/release/runtime-capture/capture.json
            target/${{ matrix.target }}/release/runtime-capture/unresolved-inputs.json
            target/${{ matrix.target }}/release/runtime-capture/link.stdout
            target/${{ matrix.target }}/release/runtime-capture/link.stderr
            target/${{ matrix.target }}/release/runtime-capture/binary
            target/${{ matrix.target }}/release/psonoci
            target/${{ matrix.target }}/release/psonoci.exe
            target/${{ matrix.target }}/release/runtime-capture/inputs/*.a
            target/${{ matrix.target }}/release/runtime-capture/inputs/*.lib
            target/${{ matrix.target }}/release/runtime-capture/inputs/*.tbd
            target/${{ matrix.target }}/release/runtime-capture/inputs/*.o
          if-no-files-found: ignore
          retention-days: 7

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Build archive
        shell: bash
        run: |
          staging="psonoci-${{ env.RELEASE_VERSION }}-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ matrix.target_type }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/psonoci.exe" "$staging/"
            7z a "$staging.zip" "$staging"
            gpg --armor --detach-sig -u psonoci@dfjk.eu "$staging.zip"
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
            echo "ASSET_SIG=$staging.zip.asc" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/psonoci" "$staging/"
            tar czf "$staging.tar.gz" "$staging"
            gpg --armor --detach-sig -u psonoci@dfjk.eu "$staging.tar.gz"
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
            echo "ASSET_SIG=$staging.tar.gz.asc" >> $GITHUB_ENV
          fi

      - name: Generate release SBOM
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          sbom="psonoci-${RELEASE_TAG}-${{ matrix.target }}.cdx.json"
          version_args=()
          if [ "$RELEASE_TAG" != "release-test" ]; then
            version_args=(--release-version "$RELEASE_TAG")
          fi
          if [ "${{ matrix.target_type }}" = "windows" ]; then
            binary="target/${{ matrix.target }}/release/psonoci.exe"
          else
            binary="target/${{ matrix.target }}/release/psonoci"
          fi
          scripts/generate-sbom.sh \
            "${{ matrix.target }}" "$binary" "$ASSET" "$sbom" \
            --artifact-url "https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}" \
            --commit "$RELEASE_COMMIT" \
            "${version_args[@]}"
          gpg --armor --detach-sig -u psonoci@dfjk.eu "$sbom"
          echo "SBOM=$sbom" >> $GITHUB_ENV
          echo "SBOM_SIG=$sbom.asc" >> $GITHUB_ENV

      - name: Attest archive and SBOM build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}

      - name: Stage signed release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SIG }}
            ${{ env.SBOM }}
            ${{ env.SBOM_SIG }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: validate-and-publish-release
    needs: ["build-release"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download signed release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify signed release evidence and validate every CycloneDX SBOM
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          targets=(
            x86_64-unknown-linux-musl
            armv7-unknown-linux-gnueabihf
            armv7-unknown-linux-musleabihf
            aarch64-unknown-linux-musl
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-gnu
            x86_64-pc-windows-msvc
          )
          scripts/verify-release-sboms.sh release-assets .asc "$RELEASE_TAG" "${targets[@]}"
          shopt -s nullglob
          sboms=(release-assets/*.cdx.json)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "No SBOMs were staged" >&2
            exit 1
          fi
          for sbom in "${sboms[@]}"; do
            docker run --rm \
              -v "$PWD/release-assets:/work" \
              cyclonedx/cyclonedx-cli:0.33.1@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7 \
              validate --input-file "/work/$(basename "$sbom")" --input-version v1_6 --fail-on-errors
          done

      - name: Upload validated files and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_TAG" != "release-test" ] && \
            [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Refusing to replace assets of an already published release" >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release files were staged" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          # Reject stale or unexpected files left by an earlier run.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/remote-release-assets.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/remote-release-assets.txt" "$RUNNER_TEMP/remote-release-assets.txt"
          printf '%s\n' "${assets[@]##*/}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets.txt"
          diff -u "$RUNNER_TEMP/expected-release-assets.txt" "$RUNNER_TEMP/remote-release-assets.txt"
          release_args=(--draft=false)
          if [[ "$RELEASE_TAG" == "release-test" || "$RELEASE_TAG" == *-rc* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release edit "$RELEASE_TAG" "${release_args[@]}"
