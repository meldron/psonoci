[package]
authors = ["Bernd Kaiser <bk@dfjk.eu>"]
description = "Command-line client for securely accessing Psono secrets in CI pipelines"
edition = "2024"
homepage = "https://github.com/meldron/psonoci"
license = "MIT"
name = "psonoci"
repository = "https://github.com/meldron/psonoci"
version = "0.6.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }

const_format = "0.2"
hex = "0.4.3"
lazy_static = "1.5"
rand = "0.8"
rayon = "1.11"
rmp = "0.8"
rmp-serde = "1.1"
reqwest = { version = "0.12", features = [
    "blocking",
    "native-tls-vendored",
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

toml = "0.9"
totp-rs = { version = "5.7.0", features = ["otpauth"] }
unicode-segmentation = "1.12"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
# The 0.2 prerelease pins cipher 0.5.0-rc.1, conflicting with modern russh.
crypto_secretbox = { version = "0.1.1", features = ["salsa20"] }
# Only key parsing and SSH-agent access are used; retain RSA support without
# enabling the unused transport compression or AWS-LC backend.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
tokio = "1.47"
futures = "0.3.31"
pgp = "0.19.0"
secrecy = "0.10.3"
zeroize = "1.8.2"
crypto_box = "0.9"
ratatui = { version = "0.30.0", features = ["scrolling-regions"] }
crossterm = "0.29.0"
tempfile = "3.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
mockall = "0.13.0"
insta = { version = "1.39", features = ["json"] }
