[build.env]
passthrough = [
    "RUSTFLAGS",
]

[target.armv7-unknown-linux-musleabihf]
image = "meldron/psonoci_builder:armv7-unknown-linux-musleabihf"
pre-build = [
    '''set -eu
    # Keep this pin synchronized with sbom/tool-versions.env; tests enforce it.
    auditable_version="0.7.5"
    marker="$CARGO_HOME/.psonoci-auditable-wrapper-$auditable_version"
    if [ ! -e "$marker" ]; then
        rustup toolchain install 1.99.1 --profile minimal
        rustup default 1.99.1
        rustup target add armv7-unknown-linux-musleabihf --toolchain 1.99.1
        real_cargo="$(rustup which cargo)"
        real_rustc="$(rustup which rustc)"
        RUSTC="$real_rustc" "$real_cargo" install --locked cargo-auditable --version "$auditable_version"
        cargo_proxy="$(command -v cargo)"
        rm -f "$cargo_proxy"
        printf '#!/bin/sh\nexport RUSTC="%s"\nexec "%s" auditable "$@"\n' "$real_rustc" "$real_cargo" >"$cargo_proxy"
        chmod +x "$cargo_proxy"
        touch "$marker"
    fi''',
    '''chmod -R a+rwX "$CARGO_HOME" "$RUSTUP_HOME"''',
]

