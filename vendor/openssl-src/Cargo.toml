[package]
name = "openssl-src"
version = "300.6.2+3.5.9"
edition = "2021"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexcrichton/openssl-src-rs"
description = "Local OpenSSL 3.5 LTS source override; upstream build adapter with pinned official OpenSSL source"

[dependencies]
cc = "1.0.79"

[features]
default = []
legacy = []
weak-crypto = []
ssl3 = []
camellia = []
idea = []
seed = []
force-engine = []
ktls = []
no-dso = []
