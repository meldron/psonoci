# Test and prerelease jobs restrict temporary artifacts; public prerelease
# downloads are published separately to the Package Registry.
.build-cross-linux:
  artifacts:
    access: maintainer

.build-native-windows:
  artifacts:
    access: maintainer

.build-macos:
  artifacts:
    access: maintainer

collect-artifacts:
  artifacts:
    access: maintainer
    expire_in: 1 week

validate-release-sboms:
  artifacts:
    access: maintainer
